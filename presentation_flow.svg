<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Header -->
  <text x="16" y="44" font-size="32" font-weight="700" fill="#0f172a">AI Ticket Triage — how a ticket moves, and how the system learns</text>
  <text x="16" y="72" font-size="18" fill="#64748b">The AI observes · the maths decides · the human approves · the approval teaches the system</text>

  <!-- Role lanes -->
  <g>
    <rect x="16" y="92" width="1568" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="16" y="92" width="8" height="104" rx="4" fill="#94a3b8"/>
    <text x="40" y="132" font-size="18" font-weight="700" fill="#475569">ADMIN</text>
    <text x="40" y="152" font-size="13" fill="#94a3b8">raises the ticket</text>

    <rect x="16" y="220" width="1568" height="200" rx="10" fill="#fbfaff" stroke="#e2e8f0"/>
    <rect x="16" y="220" width="8" height="200" rx="4" fill="#7c3aed"/>
    <text x="40" y="300" font-size="18" font-weight="700" fill="#5b21b6">TRIAGE</text>
    <text x="40" y="320" font-size="18" font-weight="700" fill="#5b21b6">ENGINE</text>

    <rect x="16" y="450" width="1568" height="106" rx="10" fill="#fffdf5" stroke="#e2e8f0"/>
    <rect x="16" y="450" width="8" height="106" rx="4" fill="#d97706"/>
    <text x="40" y="492" font-size="18" font-weight="700" fill="#b45309">TEAM LEAD</text>
    <text x="40" y="512" font-size="13" fill="#d6b06a">assigns it</text>

    <rect x="16" y="570" width="1568" height="116" rx="10" fill="#fffdf5" stroke="#e2e8f0"/>
    <rect x="16" y="570" width="8" height="116" rx="4" fill="#d97706"/>
    <text x="40" y="612" font-size="18" font-weight="700" fill="#b45309">SPECIALIST</text>
    <text x="40" y="632" font-size="13" fill="#d6b06a">solves it</text>
  </g>

  <!-- 1 · Admin intake -->
  <circle cx="158" cy="144" r="15" fill="#475569"/>
  <text x="158" y="150" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <g>
    <rect x="186" y="104" width="360" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="208" y="132" font-size="18" font-weight="600" fill="#0f172a">Ticket arrives</text>
    <text x="208" y="154" font-size="15" fill="#475569">Admin types a title and description</text>
    <text x="208" y="174" font-size="15" font-weight="700" fill="#0f172a">— nothing else.</text>

    <rect x="596" y="104" width="330" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="618" y="132" font-size="16" font-weight="600" fill="#0f172a">Optional manual override</text>
    <text x="618" y="154" font-size="14" fill="#475569">Any field can be set by hand and is</text>
    <text x="618" y="173" font-size="14" fill="#475569">kept as “set by staff”.</text>

    <rect x="1180" y="104" width="404" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="1202" y="132" font-size="16" font-weight="700" fill="#0f172a">Live workload overview</text>
    <text x="1202" y="154" font-size="14" fill="#475569">Every business entity, every specialist</text>
    <text x="1202" y="173" font-size="14" fill="#475569">— visible to all three roles.</text>
  </g>
  <line x1="546" y1="144" x2="592" y2="144" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="366" y1="184" x2="366" y2="228" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2 · The AI -->
  <circle cx="158" cy="320" r="15" fill="#5b21b6"/>
  <text x="158" y="326" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <g>
    <rect x="186" y="234" width="390" height="172" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="208" y="264" font-size="19" font-weight="700" fill="#5b21b6">The AI fills in the rest</text>
    <text x="208" y="292" font-size="15" fill="#4c1d95">entity · service · work type · the facts</text>
    <text x="208" y="314" font-size="13" fill="#7c3aed">scope · outage · workaround · regulatory · deadline</text>
    <text x="208" y="344" font-size="15" font-weight="600" fill="#4c1d95">Apertus — or another model.</text>
    <text x="208" y="372" font-size="15" fill="#4c1d95">A RAG system: it retrieves past cases</text>
    <text x="208" y="392" font-size="15" fill="#4c1d95">and learns from human feedback.</text>
  </g>
  <line x1="576" y1="320" x2="620" y2="320" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3 · Priority is maths -->
  <circle cx="650" cy="228" r="15" fill="#0f766e"/>
  <text x="650" y="234" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <g>
    <rect x="624" y="234" width="466" height="172" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
    <text x="648" y="266" font-size="20" font-weight="700" fill="#115e59">The priority is NOT AI</text>
    <text x="648" y="296" font-size="15" fill="#134e4a">Impact × Urgency matrix fixes the band;</text>
    <text x="648" y="318" font-size="15" fill="#134e4a">a formula scores it 0 – 1, weighting:</text>
    <text x="648" y="346" font-size="15" font-weight="700" fill="#0f766e">age · entities hit · regulatory breach · outage</text>
    <text x="648" y="378" font-size="16" font-weight="700" fill="#0f766e">Reproducible, auditable —</text>
    <text x="648" y="398" font-size="16" font-weight="700" fill="#0f766e">no hallucinated priorities.</text>
  </g>

  <!-- 5 · Knowledge base -->
  <circle cx="1164" cy="228" r="15" fill="#047857"/>
  <text x="1164" y="234" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <g>
    <rect x="1138" y="234" width="446" height="172" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
    <text x="1162" y="266" font-size="20" font-weight="700" fill="#065f46">It compounds on your data</text>
    <text x="1162" y="296" font-size="15" fill="#064e3b">Embedded, searchable precedent: past tickets,</text>
    <text x="1162" y="318" font-size="15" fill="#064e3b">their resolution, and who actually solved them.</text>
    <text x="1162" y="350" font-size="16" font-weight="700" fill="#047857">Only what a human approved</text>
    <text x="1162" y="372" font-size="16" font-weight="700" fill="#047857">ever enters it.</text>
  </g>

  <path d="M 1138 266 L 1112 266 L 1112 208 L 366 208 L 366 230" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowLoop)"/>
  <text x="700" y="201" font-size="15" font-weight="700" fill="#047857">▸ retrieves the closest past case</text>

  <line x1="857" y1="406" x2="857" y2="458" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4 · Human in control -->
  <circle cx="158" cy="502" r="15" fill="#b45309"/>
  <text x="158" y="508" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <g>
    <rect x="186" y="464" width="390" height="78" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="208" y="492" font-size="17" font-weight="700" fill="#92400e">Recommendation, not decision</text>
    <text x="208" y="514" font-size="14" fill="#78350f">A specialist is proposed from expertise</text>
    <text x="208" y="533" font-size="14" fill="#78350f">plus current workload.</text>

    <rect x="624" y="464" width="390" height="78" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="648" y="492" font-size="17" font-weight="700" fill="#92400e">The Team Lead stays in control</text>
    <text x="648" y="516" font-size="16" font-weight="700" fill="#78350f">approve · edit · reject</text>
    <text x="648" y="534" font-size="13" fill="#a16207">The AI never bypasses the human.</text>
  </g>
  <line x1="576" y1="502" x2="620" y2="502" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M 1014 486 L 1062 486 L 1062 432 L 1330 432 L 1330 410" fill="none" stroke="#059669" stroke-width="3.5" marker-end="url(#arrowLoop)"/>
  <rect x="1074" y="419" width="238" height="26" rx="6" fill="#059669"/>
  <text x="1086" y="437" font-size="14" font-weight="700" fill="#ffffff">every approval teaches the system</text>

  <line x1="857" y1="542" x2="857" y2="578" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Specialist row -->
  <g>
    <rect x="186" y="584" width="212" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="208" y="614" font-size="16" font-weight="700" fill="#92400e">Reject</text>
    <text x="208" y="636" font-size="13" fill="#78350f">not for me — back to</text>
    <text x="208" y="654" font-size="13" fill="#78350f">the Team Lead</text>

    <rect x="418" y="584" width="212" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="440" y="614" font-size="16" font-weight="700" fill="#92400e">Escalate</text>
    <text x="440" y="636" font-size="13" fill="#78350f">missing information —</text>
    <text x="440" y="654" font-size="13" fill="#78350f">Team Lead or team</text>

    <rect x="650" y="584" width="212" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="672" y="614" font-size="16" font-weight="700" fill="#92400e">Accept → solve</text>
    <text x="672" y="636" font-size="13" fill="#78350f">works the ticket, then</text>
    <text x="672" y="654" font-size="13" fill="#78350f">marks it solved</text>
  </g>
  <path d="M 292 584 L 292 562 L 344 562" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowBack)"/>
  <path d="M 524 584 L 524 562 L 472 562" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowBack)"/>
  <text x="326" y="555" font-size="12" fill="#b45309">back to Team Lead</text>

  <line x1="862" y1="627" x2="902" y2="627" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="906" y="584" width="380" height="86" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="928" y="614" font-size="16" font-weight="700" fill="#5b21b6">The AI writes the resolution</text>
    <text x="928" y="636" font-size="13" fill="#4c1d95">Drafted from the closest past fix — editable.</text>
    <text x="928" y="654" font-size="13" fill="#4c1d95">Knowledge captured, not lost.</text>
  </g>

  <path d="M 1286 627 L 1430 627 L 1430 416 L 1430 410" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowLoop)"/>
  <text x="1452" y="540" font-size="13" font-weight="600" fill="#047857" transform="rotate(-90 1452 540)">stored as precedent</text>

  <!-- Legend, bottom left -->
  <g font-size="15" fill="#334155">
    <rect x="16" y="712" width="15" height="15" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="42" y="725">AI / LLM</text>
    <rect x="16" y="744" width="15" height="15" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="42" y="757">Deterministic maths</text>
    <rect x="16" y="776" width="15" height="15" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="42" y="789">Human decision</text>
    <rect x="16" y="808" width="15" height="15" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="42" y="821">Learning loop</text>
  </g>

  <!-- Two differentiators, bottom right -->
  <g>
    <rect x="700" y="700" width="884" height="184" rx="10" fill="#0f172a"/>
    <text x="728" y="740" font-size="21" font-weight="700" fill="#ffffff">Two differentiators, not one</text>

    <circle cx="744" cy="784" r="15" fill="#5eead4"/>
    <text x="744" y="790" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">3</text>
    <text x="774" y="778" font-size="16" font-weight="700" fill="#5eead4">Priority is mathematics, not the model.</text>
    <text x="774" y="799" font-size="15" fill="#cbd5e1">The LLM turns prose into facts — a formula sets the priority.</text>

    <circle cx="744" cy="842" r="15" fill="#6ee7b7"/>
    <text x="744" y="848" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">5</text>
    <text x="774" y="836" font-size="16" font-weight="700" fill="#6ee7b7">Every human approval becomes precedent.</text>
    <text x="774" y="857" font-size="15" fill="#cbd5e1">It compounds on your data, never on its own unreviewed output.</text>
  </g>
</svg>
